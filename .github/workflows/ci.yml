name: VIXEN CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, spelling, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Spell check user-facing React copy
        run: npx --yes cspell@8.17.5 --no-progress "app/**/*.tsx" "components/**/*.tsx"
      - name: Kernel policy tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Production route and internal-link smoke check
        run: npm run smoke:routes
